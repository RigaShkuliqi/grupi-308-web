<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakti - Muzeu Ndërkombëtar i Kosovës</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            display: flex;
            width: 80%;
            max-width: 1000px;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .image-section {
            flex: 1;
            background: url('./images/muzeu5.jpg') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
            text-align: center;
        }
        .form-section {
            flex: 1;
            padding: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #90a4ae;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        button:hover {
            background: #90a4ae;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-section">
            <p>Kontakti</p>
        </div>
        <div class="form-section">
            <h2>Na kontaktoni</h2>
            <form>
                <div class="form-group">
                    <label>Emri dhe Mbiemri *</label>
                    <input type="text" placeholder="Shkruani emrin tuaj" required>
                </div>
                <div class="form-group">
                    <label>Telefoni *</label>
                    <input type="text" placeholder="Shkruani numrin tuaj të telefonit" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Shkruani emailin tuaj">
                </div>
                <div class="form-group">
                    <label>Zgjidhni Arsyen *</label>
                    <select required>
                        <option value="">Zgjidhni...</option>
                        <option value="info">Informata</option>
                        <option value="bileta">Bileta dhe rezervime</option>
                        <option value="evente">Evente dhe ekspozita</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mesazhi juaj</label>
                    <textarea rows="4" placeholder="Shkruani mesazhin tuaj"></textarea>
                </div>
                <button type="submit">Dërgo</button>
            </form>
        </div>
    </div>
</body>
</html>
