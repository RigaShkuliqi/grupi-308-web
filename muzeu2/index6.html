        <div class="container">
            <h2>Blerja e Biletave</h2>
            <form action="#" method="post">
                <label for="emri">Emri:</label>
                <input type="text" id="emri" name="emri" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="data">Data e vizitës:</label>
                <input type="date" id="data" name="data" required>

                <label for="numri-biletave">Numri i biletave:</label>
                <input type="number" id="numri-biletave" name="numri-biletave" min="1" required>

                <button type="submit">Bli Biletat</button>
            </form>
